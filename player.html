<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="badge">
            🎮 PLAYER MODE
        </div>

        <h1>
            JOIN<br>
            <span>GAME</span>
        </h1>

        <p class="subtitle">
            Masukkan nama dan kode room untuk bergabung.
        </p>


        <!-- =========================
             FORM JOIN
        ========================== -->

        <div class="menu">

            <!-- NAMA PLAYER -->

            <input
                id="playerName"
                type="text"
                placeholder="NAMA PLAYER"
                maxlength="20"
                autocomplete="off"
                style="
                    width:100%;
                    padding:18px;
                    margin-bottom:12px;
                    box-sizing:border-box;
                    border-radius:15px;
                    border:1px solid rgba(255,255,255,0.15);
                    background:rgba(255,255,255,0.06);
                    color:white;
                    text-align:center;
                    font-size:18px;
                    outline:none;
                "
            >


            <!-- KODE ROOM -->

            <input
                id="roomCodeInput"
                type="text"
                placeholder="KODE ROOM"
                maxlength="6"
                autocomplete="off"
                style="
                    width:100%;
                    padding:18px;
                    box-sizing:border-box;
                    border-radius:15px;
                    border:1px solid rgba(255,255,255,0.15);
                    background:rgba(255,255,255,0.06);
                    color:white;
                    text-align:center;
                    font-size:18px;
                    outline:none;
                    text-transform:uppercase;
                "
            >


            <!-- TOMBOL GABUNG -->

            <button
                id="joinButton"
                class="main-button player"
                onclick="joinRoom()"
                style="margin-top:12px;"
            >

                <span class="icon">
                    🚀
                </span>

                <div>

                    <strong>
                        GABUNG
                    </strong>

                    <small>
                        Masuk ke permainan
                    </small>

                </div>

                <span class="arrow">
                    ›
                </span>

            </button>

        </div>


        <!-- VERSION -->

        <p class="version">
            GEN Z BATTLE • V0.3
        </p>

    </main>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="script.js"></script>


    <script>

        // =====================================================
        // ELEMENT
        // =====================================================

        const playerNameInput =
            document.getElementById(
                "playerName"
            );

        const roomCodeInput =
            document.getElementById(
                "roomCodeInput"
            );

        const joinButton =
            document.getElementById(
                "joinButton"
            );


        // =====================================================
        // JOIN ROOM
        // =====================================================

        async function joinRoom() {

            // -------------------------------------------------
            // AMBIL INPUT
            // -------------------------------------------------

            const playerName =
                playerNameInput.value.trim();

            const roomCode =
                roomCodeInput.value
                    .trim()
                    .toUpperCase();


            // -------------------------------------------------
            // VALIDASI NAMA
            // -------------------------------------------------

            if (playerName === "") {

                alert(
                    "👤 Silakan masukkan nama player terlebih dahulu."
                );

                playerNameInput.focus();

                return;
            }


            // -------------------------------------------------
            // VALIDASI KODE ROOM
            // -------------------------------------------------

            if (roomCode === "") {

                alert(
                    "🔑 Silakan masukkan kode room."
                );

                roomCodeInput.focus();

                return;
            }


            // -------------------------------------------------
            // MATIKAN TOMBOL SEMENTARA
            // -------------------------------------------------

            joinButton.disabled = true;

            joinButton.style.opacity =
                "0.6";


            try {

                // =================================================
                // CARI ROOM
                // =================================================

                const {
                    data: room,
                    error: roomError
                } = await sb
                    .from("rooms")
                    .select("*")
                    .eq(
                        "code",
                        roomCode
                    )
                    .maybeSingle();


                // -------------------------------------------------
                // ERROR DATABASE
                // -------------------------------------------------

                if (roomError) {

                    console.error(
                        "❌ Room error:",
                        roomError
                    );

                    alert(
                        "❌ Gagal mencari room.\n\n" +
                        roomError.message
                    );

                    return;
                }


                // -------------------------------------------------
                // ROOM TIDAK DITEMUKAN
                // -------------------------------------------------

                if (!room) {

                    alert(
                        "❌ Kode room tidak ditemukan.\n\n" +
                        "Periksa kembali kode room."
                    );

                    return;
                }


                // =================================================
                // CEK STATUS ROOM
                // =================================================

                if (
                    room.status !==
                    "waiting"
                ) {

                    alert(
                        "⚠️ Game sudah dimulai atau sudah selesai."
                    );

                    return;
                }


                // =================================================
                // CEK JUMLAH PLAYER
                // =================================================

                const {
                    count,
                    error: countError
                } = await sb
                    .from("players")
                    .select("*", {
                        count: "exact",
                        head: true
                    })
                    .eq(
                        "room_id",
                        room.id
                    );


                if (countError) {

                    console.error(
                        "❌ Count error:",
                        countError
                    );

                    alert(
                        "❌ Gagal mengecek jumlah player.\n\n" +
                        countError.message
                    );

                    return;
                }


                // -------------------------------------------------
                // ROOM PENUH
                // -------------------------------------------------

                if (
                    count >=
                    room.max_players
                ) {

                    alert(
                        "🚫 Room sudah penuh.\n\n" +
                        "Kapasitas room: " +
                        room.max_players +
                        " pemain."
                    );

                    return;
                }


                // =================================================
                // TAMBAHKAN PLAYER
                // =================================================

                const {
                    data: player,
                    error: playerError
                } = await sb
                    .from("players")
                    .insert([
                        {
                            room_id:
                                room.id,

                            name:
                                playerName,

                            score: 0
                        }
                    ])
                    .select()
                    .single();


                // -------------------------------------------------
                // ERROR INSERT PLAYER
                // -------------------------------------------------

                if (playerError) {

                    console.error(
                        "❌ Player error:",
                        playerError
                    );

                    alert(
                        "❌ Gagal bergabung ke room.\n\n" +
                        playerError.message
                    );

                    return;
                }


                // =================================================
                // SIMPAN DATA PLAYER
                // =================================================

                localStorage.setItem(
                    "genz_player_id",
                    player.id
                );

                localStorage.setItem(
                    "genz_player_name",
                    player.name
                );


                // =================================================
                // SIMPAN DATA ROOM
                // =================================================

                localStorage.setItem(
                    "genz_room",
                    room.code
                );

                localStorage.setItem(
                    "genz_room_id",
                    room.id
                );


                // =================================================
                // ⭐ PENTING
                // SIMPAN KAPASITAS ROOM
                // =================================================

                localStorage.setItem(
                    "genz_players",
                    room.max_players
                );


                // =================================================
                // SIMPAN KATEGORI
                // =================================================

                localStorage.setItem(
                    "genz_category",
                    room.category
                );


                // =================================================
                // SIMPAN NAMA HOST
                // =================================================

                localStorage.setItem(
                    "genz_host",
                    room.host_name
                );


                // =================================================
                // BERHASIL JOIN
                // =================================================

                alert(
                    "✅ Berhasil bergabung!\n\n" +
                    "Room: " +
                    room.code +
                    "\nPlayer: " +
                    player.name +
                    "\nKapasitas: " +
                    room.max_players +
                    " pemain"
                );


                // =================================================
                // MASUK ROOM
                // =================================================

                window.location.href =
                    "room.html";


            } catch (error) {

                console.error(
                    "❌ Join error:",
                    error
                );

                alert(
                    "❌ Terjadi kesalahan.\n\n" +
                    error.message
                );

            } finally {

                // -------------------------------------------------
                // AKTIFKAN KEMBALI TOMBOL
                // -------------------------------------------------

                joinButton.disabled = false;

                joinButton.style.opacity =
                    "1";

            }

        }


        // =====================================================
        // ENTER = JOIN
        // =====================================================

        roomCodeInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    joinRoom();

                }

            }
        );


        // =====================================================
        // OTOMATIS HURUF BESAR
        // =====================================================

        roomCodeInput.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                        .toUpperCase()
                        .replace(
                            /[^A-Z0-9]/g,
                            ""
                        );

            }
        );

    </script>

</body>

</html>
