<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Room - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="badge">
            👑 CREATE GAME
        </div>

        <h1>
            BUAT<br>
            <span>ROOM</span>
        </h1>

        <p class="subtitle">
            Siapkan permainanmu sebelum<br>
            para peserta bergabung.
        </p>


        <div class="room-form">

            <!-- NAMA HOST -->

            <label>
                NAMA HOST
            </label>

            <input
                type="text"
                id="hostName"
                placeholder="Masukkan nama kamu"
                maxlength="20"
            >


            <!-- JUMLAH PEMAIN -->

            <label>
                JUMLAH PEMAIN
            </label>

            <div class="player-counter">

                <button
                    type="button"
                    onclick="changePlayers(-1)"
                >
                    −
                </button>

                <strong id="playerCount">
                    6
                </strong>

                <button
                    type="button"
                    onclick="changePlayers(1)"
                >
                    +
                </button>

            </div>


            <!-- JUMLAH RONDE -->

            <label>
                JUMLAH RONDE
            </label>

            <div class="player-counter">

                <button
                    type="button"
                    onclick="changeRounds(-1)"
                >
                    −
                </button>

                <strong id="roundCount">
                    5
                </strong>

                <button
                    type="button"
                    onclick="changeRounds(1)"
                >
                    +
                </button>

            </div>


            <!-- KATEGORI -->

            <label>
                KATEGORI
            </label>

            <select id="category">

                <option value="random">
                    🎲 Random
                </option>

                <option value="general">
                    📚 Pengetahuan Umum
                </option>

                <option value="genz">
                    🔥 Gen Z
                </option>

                <option value="random-question">
                    🤪 Pertanyaan Random
                </option>

            </select>


            <!-- BUAT ROOM -->

            <button
                class="create-button"
                onclick="generateRoom()"
            >
                🎮 BUAT ROOM
            </button>

        </div>


        <p class="version">
            GEN Z BATTLE • V0.1
        </p>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <!-- SCRIPT LAMA -->

    <script src="script.js"></script>


    <script>

        // =====================================================
        // JUMLAH RONDE
        // =====================================================

        let selectedRounds = 5;


        // =====================================================
        // ELEMENT
        // =====================================================

        const roundCount =
            document.getElementById(
                "roundCount"
            );


        // =====================================================
        // UBAH JUMLAH RONDE
        // =====================================================

        function changeRounds(change) {

            selectedRounds += change;


            // Minimum 1 ronde
            if (selectedRounds < 1) {

                selectedRounds = 1;

            }


            // Maximum 20 ronde
            if (selectedRounds > 20) {

                selectedRounds = 20;

            }


            roundCount.textContent =
                selectedRounds;

        }


        // =====================================================
        // SIMPAN JUMLAH RONDE
        // =====================================================
        //
        // Fungsi ini dipanggil setelah room berhasil dibuat.
        // Kita menyimpan pilihan ronde agar host-game.html
        // bisa mengambilnya.
        //
        // =====================================================

        function saveTotalRounds() {

            localStorage.setItem(
                "genz_total_rounds",
                selectedRounds
            );

        }

    </script>

</body>

</html>
