<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow"></div>

    <main class="container">

        <div class="badge">
            🎮 LIVE GAME SHOW
        </div>

        <h1>
            GEN Z<br>
            <span>BATTLE</span>
        </h1>

        <p class="subtitle">
            Seberapa cepat kamu berpikir,<br>
            seberapa random kamu menjawab?
        </p>

        <div class="menu">

            <button class="main-button host" onclick="openHost()">
                <span class="icon">👑</span>

                <div>
                    <strong>HOST</strong>
                    <small>Buat & kendalikan acara</small>
                </div>

                <span class="arrow">›</span>
            </button>

            <button class="main-button player" onclick="openPlayer()">
                <span class="icon">🎮</span>

                <div>
                    <strong>JOIN GAME</strong>
                    <small>Masuk sebagai peserta</small>
                </div>

                <span class="arrow">›</span>
            </button>

        </div>

        <div class="info">
            <span>👥 2–6 Players</span>
            <span>⚡ Realtime</span>
            <span>🔔 Bell Battle</span>
        </div>

        <p class="version">
            GEN Z BATTLE • V0.1
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
