<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <div class="badge">
            🔥 GEN Z BATTLE
        </div>

        <h1>
            BELL<br>
            <span>BATTLE</span>
        </h1>


        <!-- ROOM INFO -->
        <div class="room-info">

            <div>
                <span>👤 Player</span>
                <strong id="playerName">-</strong>
            </div>

            <div>
                <span>🔑 Room</span>
                <strong id="roomCode">------</strong>
            </div>

        </div>


        <!-- QUESTION -->
        <div
            class="waiting"
            style="margin-top:20px;"
        >

            <small>
                PERTANYAAN
            </small>

            <h2 id="questionText">
                Bersiap untuk pertanyaan pertama...
            </h2>

        </div>


        <!-- BELL AREA -->
        <div
            style="
                margin-top:30px;
                text-align:center;
            "
        >

            <p
                id="bellStatus"
                style="
                    margin-bottom:18px;
                    opacity:0.85;
                "
            >
                🔔 Bell siap!
            </p>


            <button
                id="bellButton"
                onclick="pressBell()"
                style="
                    width:190px;
                    height:190px;
                    border-radius:50%;
                    border:none;
                    font-size:65px;
                    cursor:pointer;
                    background:linear-gradient(
                        145deg,
                        #ffcc00,
                        #ff8c00
                    );
                    box-shadow:
                        0 10px 30px
                        rgba(255,140,0,0.4);
                    transition:
                        transform 0.1s,
                        opacity 0.2s;
                "
            >
                🔔
            </button>


            <h2
                id="winnerText"
                style="
                    margin-top:22px;
                "
            >
                Siapa paling cepat?
            </h2>

        </div>


        <!-- SCORE -->
        <div
            class="waiting"
            style="margin-top:30px;"
        >

            <h2>
                🏆 Skor
            </h2>

            <p>
                Sistem skor akan kita tambahkan
                setelah Bell Battle selesai.
            </p>

        </div>


        <p class="version">
            GEN Z BATTLE • BELL BATTLE
        </p>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        // =========================================
        // DATA ROOM & PLAYER
        // =========================================

        const playerName =
            localStorage.getItem(
                "genz_player_name"
            );

        const playerId =
            localStorage.getItem(
                "genz_player_id"
            );

        const roomCode =
            localStorage.getItem(
                "genz_room"
            );

        const roomId =
            localStorage.getItem(
                "genz_room_id"
            );


        // =========================================
        // TAMPILKAN DATA
        // =========================================

        document.getElementById(
            "playerName"
        ).textContent =
            playerName || "Host";


        document.getElementById(
            "roomCode"
        ).textContent =
            roomCode || "------";


        // =========================================
        // ELEMENT
        // =========================================

        const bellButton =
            document.getElementById(
                "bellButton"
            );

        const bellStatus =
            document.getElementById(
                "bellStatus"
            );

        const winnerText =
            document.getElementById(
                "winnerText"
            );


        // =========================================
        // BELL STATE
        // =========================================

        let bellLocked = false;

        const roundNumber = 1;


        // =========================================
        // CEK DATA ROOM
        // =========================================

        if (!roomId) {

            bellLocked = true;

            bellButton.disabled = true;

            bellButton.style.opacity = "0.4";

            bellStatus.textContent =
                "❌ Room tidak ditemukan.";

        }


        // =========================================
        // HOST TIDAK MENEKAN BELL
        // =========================================

        if (!playerId) {

            bellLocked = true;

            bellButton.disabled = true;

            bellButton.style.opacity = "0.4";

            bellButton.style.cursor =
                "not-allowed";

            bellStatus.textContent =
                "👑 Host mengatur permainan";

            winnerText.textContent =
                "Menunggu pemain menekan bell...";

        }


        // =========================================
        // TEKAN BELL
        // =========================================

        async function pressBell() {

            if (bellLocked) {
                return;
            }


            if (!playerId) {

                console.log(
                    "👑 Host tidak dapat menekan bell."
                );

                return;
            }


            if (!roomId) {

                alert(
                    "❌ Room tidak ditemukan."
                );

                return;
            }


            // Kunci sementara
            // agar tombol tidak ditekan berkali-kali
            bellLocked = true;

            bellButton.disabled = true;

            bellButton.style.opacity = "0.5";

            bellButton.style.cursor =
                "not-allowed";

            bellStatus.textContent =
                "⏳ Memproses bell...";


            try {

                const { data, error } =
                    await sb
                        .from("bell_battles")
                        .insert([
                            {
                                room_id: roomId,
                                round_number:
                                    roundNumber,
                                player_id:
                                    playerId
                            }
                        ])
                        .select()
                        .single();


                // =================================
                // BERHASIL MENJADI PEMENANG
                // =================================

                if (!error) {

                    console.log(
                        "🏆 Kamu menang bell!",
                        data
                    );

                    showWinner(
                        playerName || "Player"
                    );

                    return;
                }


                // =================================
                // KALAU KALAH BALAP
                // =================================

                console.log(
                    "🔒 Bell sudah dimenangkan player lain.",
                    error
                );


                await loadWinner();


            } catch (err) {

                console.error(
                    "❌ Error bell:",
                    err
                );

                bellLocked = false;

                bellButton.disabled = false;

                bellButton.style.opacity =
                    "1";

                bellButton.style.cursor =
                    "pointer";

                bellStatus.textContent =
                    "🔔 Bell siap!";

            }

        }


        // =========================================
        // AMBIL PEMENANG
        // =========================================

        async function loadWinner() {

            if (!roomId) {
                return;
            }


            const { data, error } =
                await sb
                    .from("bell_battles")
                    .select(`
                        id,
                        player_id,
                        round_number,
                        pressed_at
                    `)
                    .eq(
                        "room_id",
                        roomId
                    )
                    .eq(
                        "round_number",
                        roundNumber
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengambil pemenang:",
                    error
                );

                return;
            }


            if (!data) {

                bellLocked = false;

                bellButton.disabled = false;

                bellButton.style.opacity =
                    "1";

                bellButton.style.cursor =
                    "pointer";

                bellStatus.textContent =
                    "🔔 Bell siap!";

                return;
            }


            await showWinnerById(
                data.player_id
            );

        }


        // =========================================
        // TAMPILKAN PEMENANG BERDASARKAN ID
        // =========================================

        async function showWinnerById(
            winnerPlayerId
        ) {

            const { data, error } =
                await sb
                    .from("players")
                    .select("name")
                    .eq(
                        "id",
                        winnerPlayerId
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengambil nama pemenang:",
                    error
                );

                showWinner(
                    "Player"
                );

                return;
            }


            showWinner(
                data?.name || "Player"
            );

        }


        // =========================================
        // TAMPILKAN PEMENANG
        // =========================================

        function showWinner(
            winnerName
        ) {

            bellLocked = true;

            bellButton.disabled = true;

            bellButton.style.opacity =
                "0.35";

            bellButton.style.cursor =
                "not-allowed";


            bellStatus.textContent =
                "🔒 BELL TERKUNCI";


            if (
                winnerName ===
                (playerName || "")
            ) {

                winnerText.textContent =
                    "🏆 KAMU MENANG BELL!";

            } else {

                winnerText.textContent =
                    "🏆 " +
                    winnerName +
                    " MENANG BELL!";

            }

        }


        // =========================================
        // REALTIME BELL
        // =========================================

        function listenForBell() {

            if (!roomId) {
                return;
            }


            sb
                .channel(
                    "bell-battle-" +
                    roomId +
                    "-" +
                    roundNumber
                )
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "bell_battles",
                        filter:
                            "room_id=eq." +
                            roomId
                    },
                    async function(payload) {

                        console.log(
                            "🔔 Bell realtime:",
                            payload
                        );


                        if (
                            payload.new
                                .round_number
                            !==
                            roundNumber
                        ) {

                            return;
                        }


                        await showWinnerById(
                            payload.new.player_id
                        );

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime Bell:",
                            status
                        );

                    }
                );

        }


        // =========================================
        // CEK PEMENANG YANG SUDAH ADA
        // =========================================

        async function initializeBell() {

            if (!roomId) {
                return;
            }


            await loadWinner();

            listenForBell();

        }


        // =========================================
        // MULAI
        // =========================================

        initializeBell();

    </script>

</body>

</html>
