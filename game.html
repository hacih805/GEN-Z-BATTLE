<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">


    <!-- =====================================================
         KHUSUS HALAMAN GAME
    ====================================================== -->

    <style>

        /* ================================================
           FIX SCROLL HP
        ================================================ */

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh !important;
            height: auto !important;

            overflow-y: auto !important;
            overflow-x: hidden !important;

            align-items: flex-start !important;

            padding-top: 20px !important;
            padding-bottom: 40px !important;
        }


        .container {
            width: 100%;
            max-width: 520px;

            min-height: auto !important;
            height: auto !important;

            padding-bottom: 50px;
        }


        /* ================================================
           AREA BELL
        ================================================ */

        #bellArea {
            margin-top: 30px;
            text-align: center;
        }


        /* ================================================
           TOMBOL BELL
        ================================================ */

        #bellButton {
            width: 190px;
            height: 190px;

            border-radius: 50%;
            border: none;

            font-size: 65px;

            cursor: pointer;

            background:
                linear-gradient(
                    145deg,
                    #ffcc00,
                    #ff8c00
                );

            box-shadow:
                0 10px 30px
                rgba(255,140,0,0.4);

            transition:
                transform 0.1s,
                opacity 0.2s;

            -webkit-tap-highlight-color:
                transparent;
        }


        #bellButton:active {
            transform: scale(0.94);
        }


        #bellButton:disabled {
            transform: none;
        }


        /* ================================================
           AREA JAWABAN
        ================================================ */

        #answerArea {
            display: none;

            width: 100%;

            margin-top: 25px !important;

            box-sizing: border-box;
        }


        #answerArea textarea {
            display: block;

            width: 100%;

            min-height: 120px;

            box-sizing: border-box;

            padding: 15px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            background:
                rgba(255,255,255,0.08);

            color: inherit;

            font-size: 16px;

            resize: vertical;

            outline: none;

            font-family: inherit;
        }


        #answerArea textarea:focus {
            border-color: #667eea;
        }


        #submitAnswerButton {
            display: block;

            width: 100%;

            min-height: 52px;

            margin-top: 15px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        #submitAnswerButton:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* ================================================
           MOBILE
        ================================================ */

        @media (max-width: 480px) {

            body {
                padding:
                    12px
                    12px
                    40px
                    12px !important;
            }


            .container {
                width: 100%;
            }


            #bellButton {
                width: 170px;
                height: 170px;

                font-size: 58px;
            }


            #questionText {
                font-size: 20px;

                line-height: 1.45;
            }


            #winnerText {
                font-size: 20px;

                line-height: 1.4;
            }

        }

    </style>

</head>


<body>

    <main class="container">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="badge">
            🔥 GEN Z BATTLE
        </div>


        <h1>
            BELL<br>
            <span>BATTLE</span>
        </h1>


        <!-- =====================================================
             PLAYER & ROOM
        ====================================================== -->

        <div class="room-info">

            <div>

                <span>
                    👤 Player
                </span>

                <strong id="playerName">
                    -
                </strong>

            </div>


            <div>

                <span>
                    🔑 Room
                </span>

                <strong id="roomCode">
                    ------
                </strong>

            </div>

        </div>


        <!-- =====================================================
             RONDE
        ====================================================== -->

        <div
            class="waiting"
            style="margin-top:20px;"
        >

            <small>
                RONDE
            </small>

            <h2 id="roundDisplay">
                Ronde 1
            </h2>

        </div>


        <!-- =====================================================
             PERTANYAAN
        ====================================================== -->

        <div
            class="waiting"
            style="margin-top:20px;"
        >

            <small>
                ❓ PERTANYAAN
            </small>


            <h2 id="questionText">
                Menunggu pertanyaan...
            </h2>

        </div>


        <!-- =====================================================
             BELL BATTLE
        ====================================================== -->

        <div id="bellArea">


            <p
                id="bellStatus"
                style="
                    margin-bottom:18px;
                    opacity:0.85;
                "
            >
                ⏳ Menunggu pertanyaan
            </p>


            <button
                id="bellButton"
                type="button"
                onclick="pressBell()"
            >
                🔔
            </button>


            <h2
                id="winnerText"
                style="
                    margin-top:22px;
                "
            >
                Siapa paling cepat?
            </h2>


        </div>


        <!-- =====================================================
             AREA JAWABAN
        ====================================================== -->

        <div
            id="answerArea"
            class="waiting"
        >

            <h2>
                ✍️ Jawaban Kamu
            </h2>


            <p
                id="answerInfo"
                style="
                    opacity:0.8;
                    margin-bottom:15px;
                    line-height:1.5;
                "
            >
                🏆 Kamu memenangkan Bell!
            </p>


            <textarea
                id="answerInput"
                rows="4"
                maxlength="500"
                placeholder="Tulis jawaban kamu di sini..."
            ></textarea>


            <button
                id="submitAnswerButton"
                type="button"
                onclick="submitAnswer()"
            >
                📤 KIRIM JAWABAN
            </button>


            <p
                id="answerStatus"
                style="
                    margin-top:15px;
                    text-align:center;
                    white-space:pre-line;
                    line-height:1.5;
                "
            ></p>


        </div>


        <!-- =====================================================
             SKOR
        ====================================================== -->

        <div
            class="waiting"
            style="margin-top:30px;"
        >

            <h2>
                🏆 Skor
            </h2>

            <p>
                Skor akan diperbarui oleh Host.
            </p>

        </div>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <p class="version">
            GEN Z BATTLE • REALTIME
        </p>


    </main>


    <!-- =========================================================
         SUPABASE
    ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>


        // =====================================================
        // DATA PLAYER
        // =====================================================

        const playerName =
            localStorage.getItem(
                "genz_player_name"
            );


        const playerId =
            localStorage.getItem(
                "genz_player_id"
            );


        const roomCode =
            localStorage.getItem(
                "genz_room"
            );


        const roomId =
            localStorage.getItem(
                "genz_room_id"
            );


        // =====================================================
        // ELEMENT
        // =====================================================

        const playerNameElement =
            document.getElementById(
                "playerName"
            );


        const roomCodeElement =
            document.getElementById(
                "roomCode"
            );


        const roundDisplay =
            document.getElementById(
                "roundDisplay"
            );


        const questionText =
            document.getElementById(
                "questionText"
            );


        const bellButton =
            document.getElementById(
                "bellButton"
            );


        const bellStatus =
            document.getElementById(
                "bellStatus"
            );


        const winnerText =
            document.getElementById(
                "winnerText"
            );


        const answerArea =
            document.getElementById(
                "answerArea"
            );


        const answerInput =
            document.getElementById(
                "answerInput"
            );


        const answerInfo =
            document.getElementById(
                "answerInfo"
            );


        const submitAnswerButton =
            document.getElementById(
                "submitAnswerButton"
            );


        const answerStatus =
            document.getElementById(
                "answerStatus"
            );


        // =====================================================
        // TAMPILKAN DATA
        // =====================================================

        playerNameElement.textContent =
            playerName || "Player";


        roomCodeElement.textContent =
            roomCode || "------";


        // =====================================================
        // STATE GAME
        // =====================================================

        let currentRound = 1;

        let currentQuestion = "";

        let bellLocked = true;

        let currentWinnerId = null;

        let answerSubmitted = false;


        // =====================================================
        // KUNCI BELL
        // =====================================================

        function lockBell() {

            bellLocked = true;

            bellButton.disabled = true;

            bellButton.style.opacity =
                "0.35";

            bellButton.style.cursor =
                "not-allowed";

        }


        // =====================================================
        // BUKA BELL
        // =====================================================

        function unlockBell() {

            if (!playerId) {
                return;
            }


            bellLocked = false;

            bellButton.disabled = false;

            bellButton.style.opacity =
                "1";

            bellButton.style.cursor =
                "pointer";

        }


        // =====================================================
        // RESET JAWABAN
        // =====================================================

        function resetAnswerArea() {

            currentWinnerId = null;

            answerSubmitted = false;


            answerArea.style.display =
                "none";


            /*
             * Bell muncul kembali
             * untuk ronde baru
             */

            bellButton.style.display =
                "block";


            answerInput.value = "";


            answerInput.disabled =
                false;


            submitAnswerButton.disabled =
                false;


            submitAnswerButton.textContent =
                "📤 KIRIM JAWABAN";


            answerStatus.textContent =
                "";

        }


        // =====================================================
        // TAMPILKAN AREA JAWABAN
        // =====================================================

        function showAnswerArea() {

            if (!playerId) {
                return;
            }


            if (!currentWinnerId) {
                return;
            }


            /*
             * Bukan pemenang
             */

            if (
                currentWinnerId !==
                playerId
            ) {

                answerArea.style.display =
                    "none";

                return;

            }


            /*
             * Player adalah pemenang
             */

            answerArea.style.display =
                "block";


            answerInfo.textContent =
                "🏆 Kamu memenangkan Bell! Silakan jawab pertanyaan.";


            /*
             * Bell disembunyikan
             * supaya kolom jawaban langsung terlihat
             */

            bellButton.style.display =
                "none";


            bellStatus.textContent =
                "🔒 BELL TERKUNCI";


            /*
             * Fokus ke kolom jawaban
             */

            setTimeout(
                function() {

                    answerInput.focus();

                },
                300
            );

        }


        // =====================================================
        // TAMPILKAN PERTANYAAN
        // =====================================================

        function renderQuestion() {

            roundDisplay.textContent =
                "Ronde " +
                currentRound;


            /*
             * ADA PERTANYAAN
             */

            if (currentQuestion) {

                questionText.textContent =
                    currentQuestion;


                bellStatus.textContent =
                    "🔔 Bell siap!";


                winnerText.textContent =
                    "Siapa paling cepat?";


                resetAnswerArea();


                unlockBell();


                return;

            }


            /*
             * BELUM ADA PERTANYAAN
             */

            questionText.textContent =
                "Menunggu pertanyaan...";


            bellStatus.textContent =
                "⏳ Menunggu pertanyaan";


            winnerText.textContent =
                "Host sedang menyiapkan pertanyaan.";


            resetAnswerArea();


            lockBell();

        }


        // =====================================================
        // LOAD ROOM
        // =====================================================

        async function loadRoomGame() {

            if (!roomId) {

                questionText.textContent =
                    "❌ Room tidak ditemukan.";

                bellStatus.textContent =
                    "Room ID tidak tersedia.";

                lockBell();

                return;

            }


            const {
                data: room,
                error
            } = await sb
                .from("rooms")
                .select(
                    "current_question, round_number, status"
                )
                .eq(
                    "id",
                    roomId
                )
                .maybeSingle();


            /*
             * ERROR
             */

            if (error) {

                console.error(
                    "❌ Gagal mengambil room:",
                    error
                );


                questionText.textContent =
                    "❌ Gagal mengambil game.";

                lockBell();

                return;

            }


            /*
             * ROOM TIDAK ADA
             */

            if (!room) {

                questionText.textContent =
                    "❌ Room tidak ditemukan.";

                lockBell();

                return;

            }


            currentRound =
                Number(
                    room.round_number
                ) || 1;


            currentQuestion =
                room.current_question ||
                "";


            renderQuestion();


            await loadWinner();

        }


        // =====================================================
        // TEKAN BELL
        // =====================================================

        async function pressBell() {

            if (bellLocked) {
                return;
            }


            if (!playerId) {

                bellStatus.textContent =
                    "❌ Player ID tidak ditemukan.";

                return;

            }


            if (!roomId) {

                bellStatus.textContent =
                    "❌ Room tidak ditemukan.";

                return;

            }


            /*
             * KUNCI BELL SEBELUM INSERT
             */

            lockBell();


            bellStatus.textContent =
                "⏳ Memproses Bell...";


            winnerText.textContent =
                "Menentukan pemenang...";


            try {

                const {
                    data,
                    error
                } = await sb
                    .from("bell_battles")
                    .insert({

                        room_id:
                            roomId,

                        round_number:
                            currentRound,

                        player_id:
                            playerId

                    })
                    .select()
                    .single();


                /*
                 * ERROR
                 */

                if (error) {

                    console.error(
                        "❌ Bell error:",
                        error
                    );


                    /*
                     * Player lain sudah menang
                     */

                    if (
                        error.code ===
                        "23505"
                    ) {

                        bellStatus.textContent =
                            "🔒 Bell sudah dimenangkan!";


                        await loadWinner();


                        return;

                    }


                    bellStatus.textContent =
                        "❌ Gagal menekan Bell.";


                    winnerText.textContent =
                        error.message ||
                        "Terjadi kesalahan.";


                    /*
                     * Jika gagal,
                     * buka kembali Bell
                     */

                    unlockBell();


                    return;

                }


                /*
                 * BERHASIL
                 */

                console.log(
                    "🏆 Bell berhasil:",
                    data
                );


                currentWinnerId =
                    playerId;


                showWinner(
                    playerName ||
                    "Player"
                );


                showAnswerArea();


            } catch (error) {

                console.error(
                    "❌ Error Bell:",
                    error
                );


                bellStatus.textContent =
                    "❌ Terjadi kesalahan.";


                winnerText.textContent =
                    error.message ||
                    "Silakan coba lagi.";


                unlockBell();

            }

        }


        // =====================================================
        // LOAD PEMENANG
        // =====================================================

        async function loadWinner() {

            if (!roomId) {
                return;
            }


            const {
                data,
                error
            } = await sb
                .from("bell_battles")
                .select(
                    "id, player_id, round_number, pressed_at"
                )
                .eq(
                    "room_id",
                    roomId
                )
                .eq(
                    "round_number",
                    currentRound
                )
                .maybeSingle();


            /*
             * ERROR
             */

            if (error) {

                console.error(
                    "❌ Gagal mengambil pemenang:",
                    error
                );

                return;

            }


            /*
             * BELUM ADA PEMENANG
             */

            if (!data) {

                currentWinnerId = null;


                winnerText.textContent =
                    "Siapa paling cepat?";


                bellStatus.textContent =
                    "🔔 Bell siap!";


                answerArea.style.display =
                    "none";


                bellButton.style.display =
                    "block";


                unlockBell();


                return;

            }


            /*
             * ADA PEMENANG
             */

            currentWinnerId =
                data.player_id;


            await showWinnerById(
                data.player_id
            );


            showAnswerArea();


            /*
             * Cek jawaban sebelumnya
             */

            await checkExistingAnswer();

        }


        // =====================================================
        // CEK JAWABAN YANG SUDAH ADA
        // =====================================================

        async function checkExistingAnswer() {

            if (
                !roomId ||
                !currentWinnerId ||
                currentWinnerId !== playerId
            ) {
                return;
            }


            const {
                data,
                error
            } = await sb
                .from("answers")
                .select(
                    "id, answer"
                )
                .eq(
                    "room_id",
                    roomId
                )
                .eq(
                    "round_number",
                    currentRound
                )
                .eq(
                    "player_id",
                    playerId
                )
                .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengecek jawaban:",
                    error
                );

                return;

            }


            if (!data) {
                return;
            }


            answerSubmitted = true;


            answerInput.value =
                data.answer;


            answerInput.disabled =
                true;


            submitAnswerButton.disabled =
                true;


            submitAnswerButton.textContent =
                "✅ JAWABAN TERKIRIM";


            answerStatus.textContent =
                "✅ Jawaban sudah diterima Host.";

        }


        // =====================================================
        // AMBIL NAMA PEMENANG
        // =====================================================

        async function showWinnerById(
            winnerPlayerId
        ) {

            const {
                data,
                error
            } = await sb
                .from("players")
                .select(
                    "name"
                )
                .eq(
                    "id",
                    winnerPlayerId
                )
                .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengambil nama:",
                    error
                );


                showWinner(
                    "Player"
                );


                return;

            }


            showWinner(
                data?.name ||
                "Player"
            );

        }


        // =====================================================
        // TAMPILKAN PEMENANG
        // =====================================================

        function showWinner(
            winnerName
        ) {

            lockBell();


            bellStatus.textContent =
                "🔒 BELL TERKUNCI";


            if (
                winnerName ===
                (playerName || "")
            ) {

                winnerText.textContent =
                    "🏆 KAMU MENANG BELL!";

            } else {

                winnerText.textContent =
                    "🏆 " +
                    winnerName +
                    " MENANG BELL!";

            }

        }


        // =====================================================
        // KIRIM JAWABAN
        // =====================================================

        async function submitAnswer() {

            if (!playerId) {

                answerStatus.textContent =
                    "❌ Player ID tidak ditemukan.";

                return;

            }


            if (!roomId) {

                answerStatus.textContent =
                    "❌ Room ID tidak ditemukan.";

                return;

            }


            /*
             * Pastikan pemenang
             */

            if (
                currentWinnerId !==
                playerId
            ) {

                answerStatus.textContent =
                    "❌ Hanya pemenang Bell yang dapat menjawab.";

                return;

            }


            /*
             * Jangan kirim dua kali
             */

            if (answerSubmitted) {

                answerStatus.textContent =
                    "⚠️ Jawaban sudah dikirim.";

                return;

            }


            /*
             * Ambil jawaban
             */

            const answer =
                answerInput.value.trim();


            /*
             * Jawaban kosong
             */

            if (!answer) {

                answerStatus.textContent =
                    "⚠️ Jawaban belum diisi.";

                answerInput.focus();

                return;

            }


            /*
             * Kunci tombol
             */

            submitAnswerButton.disabled =
                true;


            answerInput.disabled =
                true;


            answerStatus.textContent =
                "⏳ Mengirim jawaban...";


            console.log(
                "📤 Mengirim jawaban:",
                {
                    room_id:
                        roomId,

                    round_number:
                        currentRound,

                    player_id:
                        playerId,

                    answer:
                        answer
                }
            );


            try {

                const {
                    data,
                    error
                } = await sb
                    .from("answers")
                    .insert({

                        room_id:
                            roomId,

                        round_number:
                            currentRound,

                        player_id:
                            playerId,

                        answer:
                            answer

                    })
                    .select()
                    .single();


                /*
                 * ERROR
                 */

                if (error) {

                    console.error(
                        "❌ Supabase Answer Error:",
                        error
                    );


                    /*
                     * Sudah pernah menjawab
                     */

                    if (
                        error.code ===
                        "23505"
                    ) {

                        answerSubmitted =
                            true;


                        answerStatus.textContent =
                            "⚠️ Jawaban sudah dikirim sebelumnya.";


                        submitAnswerButton.textContent =
                            "✅ JAWABAN TERKIRIM";


                        return;

                    }


                    /*
                     * Error lainnya
                     */

                    answerStatus.textContent =
                        "❌ Gagal mengirim jawaban.\n" +
                        error.message;


                    answerInput.disabled =
                        false;


                    submitAnswerButton.disabled =
                        false;


                    return;

                }


                /*
                 * BERHASIL
                 */

                answerSubmitted =
                    true;


                answerStatus.textContent =
                    "✅ Jawaban berhasil dikirim ke Host!";


                submitAnswerButton.textContent =
                    "✅ JAWABAN TERKIRIM";


                console.log(
                    "✅ Jawaban berhasil masuk ke Supabase:",
                    data
                );


            } catch (error) {

                console.error(
                    "❌ Submit Answer Error:",
                    error
                );


                answerStatus.textContent =
                    "❌ Terjadi kesalahan.\n" +
                    error.message;


                answerInput.disabled =
                    false;


                submitAnswerButton.disabled =
                    false;

            }

        }


        // =====================================================
        // REALTIME ROOM
        // =====================================================

        function listenForRoomChanges() {

            if (!roomId) {
                return;
            }


            sb
                .channel(
                    "game-room-" +
                    roomId
                )
                .on(
                    "postgres_changes",
                    {
                        event:
                            "UPDATE",

                        schema:
                            "public",

                        table:
                            "rooms",

                        filter:
                            "id=eq." +
                            roomId
                    },
                    async function(payload) {

                        console.log(
                            "⚡ Room berubah:",
                            payload.new
                        );


                        currentRound =
                            Number(
                                payload.new.round_number
                            ) || 1;


                        currentQuestion =
                            payload.new.current_question ||
                            "";


                        renderQuestion();


                        await loadWinner();

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime Room:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // REALTIME BELL
        // =====================================================

        function listenForBell() {

            if (!roomId) {
                return;
            }


            sb
                .channel(
                    "bell-game-" +
                    roomId
                )
                .on(
                    "postgres_changes",
                    {
                        event:
                            "INSERT",

                        schema:
                            "public",

                        table:
                            "bell_battles",

                        filter:
                            "room_id=eq." +
                            roomId
                    },
                    async function(payload) {

                        console.log(
                            "🔔 Bell realtime:",
                            payload
                        );


                        /*
                         * Abaikan ronde lain
                         */

                        if (
                            Number(
                                payload.new.round_number
                            ) !==
                            currentRound
                        ) {

                            return;

                        }


                        currentWinnerId =
                            payload.new.player_id;


                        await showWinnerById(
                            payload.new.player_id
                        );


                        showAnswerArea();

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime Bell:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // REALTIME ANSWER
        // =====================================================

        function listenForAnswers() {

            if (!roomId) {
                return;
            }


            sb
                .channel(
                    "player-answer-" +
                    roomId
                )
                .on(
                    "postgres_changes",
                    {
                        event:
                            "INSERT",

                        schema:
                            "public",

                        table:
                            "answers",

                        filter:
                            "room_id=eq." +
                            roomId
                    },
                    function(payload) {

                        console.log(
                            "💬 Answer realtime:",
                            payload
                        );


                        /*
                         * Abaikan ronde lain
                         */

                        if (
                            Number(
                                payload.new.round_number
                            ) !==
                            currentRound
                        ) {

                            return;

                        }


                        /*
                         * Pastikan jawaban milik
                         * player ini
                         */

                        if (
                            payload.new.player_id !==
                            playerId
                        ) {

                            return;

                        }


                        answerSubmitted =
                            true;


                        answerStatus.textContent =
                            "✅ Jawaban berhasil diterima!";

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime Answer:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // INITIALIZE
        // =====================================================

        async function initializeGame() {

            /*
             * Kondisi awal
             */

            lockBell();

            resetAnswerArea();


            /*
             * Ambil room
             */

            await loadRoomGame();


            /*
             * Aktifkan realtime
             */

            listenForRoomChanges();

            listenForBell();

            listenForAnswers();

        }


        // =====================================================
        // JALANKAN GAME
        // =====================================================

        initializeGame();


    </script>
