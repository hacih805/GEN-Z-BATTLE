<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="badge">
            🔥 GEN Z BATTLE
        </div>

        <h1>
            BELL<br>
            <span>BATTLE</span>
        </h1>


        <!-- =========================
             ROOM INFO
        ========================== -->

        <div class="room-info">

            <div>
                <span>👤 Player</span>
                <strong id="playerName">-</strong>
            </div>

            <div>
                <span>🔑 Room</span>
                <strong id="roomCode">------</strong>
            </div>

        </div>


        <!-- =========================
             QUESTION
        ========================== -->

        <div
            class="waiting"
            style="margin-top:20px;"
        >

            <small>
                PERTANYAAN
            </small>

            <h2 id="questionText">
                Bersiap untuk pertanyaan pertama...
            </h2>

        </div>


        <!-- =========================
             BELL AREA
        ========================== -->

        <div
            style="
                margin-top:30px;
                text-align:center;
            "
        >

            <p
                id="bellStatus"
                style="
                    margin-bottom:18px;
                    opacity:0.85;
                "
            >
                🔔 Bell siap!
            </p>


            <button
                id="bellButton"
                type="button"
                onclick="pressBell()"
                style="
                    width:190px;
                    height:190px;
                    border-radius:50%;
                    border:none;
                    font-size:65px;
                    cursor:pointer;
                    background:linear-gradient(
                        145deg,
                        #ffcc00,
                        #ff8c00
                    );
                    box-shadow:
                        0 10px 30px
                        rgba(255,140,0,0.4);
                    transition:
                        transform 0.1s,
                        opacity 0.2s;
                "
            >
                🔔
            </button>


            <h2
                id="winnerText"
                style="
                    margin-top:22px;
                "
            >
                Siapa paling cepat?
            </h2>

        </div>


        <!-- =========================
             SCORE
        ========================== -->

        <div
            class="waiting"
            style="margin-top:30px;"
        >

            <h2>
                🏆 Skor
            </h2>

            <p>
                Sistem skor akan kita tambahkan
                setelah Bell Battle selesai.
            </p>

        </div>


        <p class="version">
            GEN Z BATTLE • BELL BATTLE
        </p>

    </main>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        // =====================================================
        // DATA ROOM & PLAYER
        // =====================================================

        const playerName =
            localStorage.getItem(
                "genz_player_name"
            );

        const playerId =
            localStorage.getItem(
                "genz_player_id"
            );

        const roomCode =
            localStorage.getItem(
                "genz_room"
            );

        const roomId =
            localStorage.getItem(
                "genz_room_id"
            );


        // =====================================================
        // ROUND
        // =====================================================

        const roundNumber = 1;


        // =====================================================
        // ELEMENT
        // =====================================================

        const playerNameElement =
            document.getElementById(
                "playerName"
            );

        const roomCodeElement =
            document.getElementById(
                "roomCode"
            );

        const bellButton =
            document.getElementById(
                "bellButton"
            );

        const bellStatus =
            document.getElementById(
                "bellStatus"
            );

        const winnerText =
            document.getElementById(
                "winnerText"
            );


        // =====================================================
        // TAMPILKAN DATA
        // =====================================================

        playerNameElement.textContent =
            playerName || "Host";

        roomCodeElement.textContent =
            roomCode || "------";


        // =====================================================
        // BELL STATE
        // =====================================================

        let bellLocked = false;


        // =====================================================
        // FUNGSI KUNCI BELL
        // =====================================================

        function lockBell() {

            bellLocked = true;

            bellButton.disabled = true;

            bellButton.style.opacity =
                "0.35";

            bellButton.style.cursor =
                "not-allowed";

        }


        // =====================================================
        // FUNGSI BUKA BELL
        // =====================================================

        function unlockBell() {

            bellLocked = false;

            bellButton.disabled = false;

            bellButton.style.opacity =
                "1";

            bellButton.style.cursor =
                "pointer";

        }


        // =====================================================
        // CEK DATA ROOM
        // =====================================================

        if (!roomId) {

            lockBell();

            bellStatus.textContent =
                "❌ Room tidak ditemukan.";

            winnerText.textContent =
                "Room ID tidak tersedia.";

        }


        // =====================================================
        // HOST TIDAK BOLEH MENEKAN BELL
        // =====================================================

        if (!playerId) {

            lockBell();

            bellStatus.textContent =
                "👑 Host mengatur permainan";

            winnerText.textContent =
                "Menunggu pemain menekan bell...";

        }


        // =====================================================
        // TEKAN BELL
        // =====================================================

        async function pressBell() {

            // Jangan proses jika sudah terkunci
            if (bellLocked) {
                return;
            }


            // Cek Player ID
            if (!playerId) {

                bellStatus.textContent =
                    "❌ Player ID tidak ditemukan.";

                winnerText.textContent =
                    "Silakan kembali dan join room lagi.";

                return;
            }


            // Cek Room ID
            if (!roomId) {

                bellStatus.textContent =
                    "❌ Room ID tidak ditemukan.";

                winnerText.textContent =
                    "Silakan kembali ke room.";

                return;
            }


            // =================================================
            // KUNCI SEMENTARA
            // =================================================

            lockBell();

            bellStatus.textContent =
                "⏳ Memproses bell...";

            winnerText.textContent =
                "Menentukan siapa yang paling cepat...";


            try {

                // =================================================
                // MASUKKAN BELL KE DATABASE
                // =================================================

                const { data, error } =
                    await sb
                        .from("bell_battles")
                        .insert({
                            room_id: roomId,
                            round_number: roundNumber,
                            player_id: playerId
                        })
                        .select()
                        .single();


                // =================================================
                // JIKA INSERT ERROR
                // =================================================

                if (error) {

                    console.error(
                        "❌ Bell error:",
                        error
                    );


                    // Kemungkinan player lain
                    // sudah menang lebih dulu
                    if (
                        error.code ===
                        "23505"
                    ) {

                        bellStatus.textContent =
                            "🔒 Bell sudah dimenangkan!";

                        await loadWinner();

                        return;
                    }


                    // Error lainnya
                    unlockBell();

                    bellStatus.textContent =
                        "❌ Gagal menekan bell.";

                    winnerText.textContent =
                        error.message ||
                        "Terjadi kesalahan.";

                    return;
                }


                // =================================================
                // BERHASIL MENJADI PEMENANG
                // =================================================

                console.log(
                    "🏆 Bell berhasil:",
                    data
                );


                showWinner(
                    playerName || "Player"
                );


            } catch (error) {

                console.error(
                    "❌ Error:",
                    error
                );


                unlockBell();

                bellStatus.textContent =
                    "❌ Terjadi kesalahan.";

                winnerText.textContent =
                    error.message ||
                    "Silakan coba lagi.";

            }

        }


        // =====================================================
        // AMBIL PEMENANG DARI DATABASE
        // =====================================================

        async function loadWinner() {

            if (!roomId) {
                return;
            }


            const { data, error } =
                await sb
                    .from("bell_battles")
                    .select(
                        "id, player_id, round_number, pressed_at"
                    )
                    .eq(
                        "room_id",
                        roomId
                    )
                    .eq(
                        "round_number",
                        roundNumber
                    )
                    .maybeSingle();


            // =================================================
            // ERROR
            // =================================================

            if (error) {

                console.error(
                    "❌ Gagal mengambil pemenang:",
                    error
                );

                bellStatus.textContent =
                    "❌ Gagal mengambil hasil bell.";

                return;
            }


            // =================================================
            // BELUM ADA PEMENANG
            // =================================================

            if (!data) {

                unlockBell();

                bellStatus.textContent =
                    "🔔 Bell siap!";

                winnerText.textContent =
                    "Siapa paling cepat?";

                return;
            }


            // =================================================
            // ADA PEMENANG
            // =================================================

            await showWinnerById(
                data.player_id
            );

        }


        // =====================================================
        // AMBIL NAMA PEMENANG
        // =====================================================

        async function showWinnerById(
            winnerPlayerId
        ) {

            const { data, error } =
                await sb
                    .from("players")
                    .select("name")
                    .eq(
                        "id",
                        winnerPlayerId
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengambil nama:",
                    error
                );

                showWinner(
                    "Player"
                );

                return;
            }


            const winnerName =
                data?.name ||
                "Player";


            showWinner(
                winnerName
            );

        }


        // =====================================================
        // TAMPILKAN PEMENANG
        // =====================================================

        function showWinner(
            winnerName
        ) {

            lockBell();


            bellStatus.textContent =
                "🔒 BELL TERKUNCI";


            if (
                winnerName ===
                (playerName || "")
            ) {

                winnerText.textContent =
                    "🏆 KAMU MENANG BELL!";

            } else {

                winnerText.textContent =
                    "🏆 " +
                    winnerName +
                    " MENANG BELL!";

            }

        }


        // =====================================================
        // REALTIME BELL
        // =====================================================

        function listenForBell() {

            if (!roomId) {
                return;
            }


            const channel =
                sb.channel(
                    "bell-battle-" +
                    roomId +
                    "-" +
                    roundNumber
                );


            channel
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "bell_battles",
                        filter:
                            "room_id=eq." +
                            roomId
                    },
                    async function(payload) {

                        console.log(
                            "🔔 Bell realtime:",
                            payload
                        );


                        // Pastikan ronde sama
                        if (
                            Number(
                                payload.new.round_number
                            ) !==
                            roundNumber
                        ) {

                            return;
                        }


                        // Tampilkan pemenang
                        await showWinnerById(
                            payload.new.player_id
                        );

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime Bell:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // INISIALISASI
        // =====================================================

        async function initializeBell() {

            if (!roomId) {
                return;
            }


            // Cek apakah sudah ada pemenang
            await loadWinner();


            // Aktifkan realtime
            listenForBell();

        }


        // =====================================================
        // MULAI GAME
        // =====================================================

        initializeBell();

    </script>

</body>

</html>
