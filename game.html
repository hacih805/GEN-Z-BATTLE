<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->

        <div class="badge">
            🔥 GEN Z BATTLE
        </div>

        <h1>
            BELL<br>
            <span>BATTLE</span>
        </h1>


        <!-- PLAYER & ROOM -->

        <div class="room-info">

            <div>
                <span>👤 Player</span>
                <strong id="playerName">-</strong>
            </div>

            <div>
                <span>🔑 Room</span>
                <strong id="roomCode">------</strong>
            </div>

        </div>


        <!-- ROUND -->

        <div
            class="waiting"
            style="margin-top:20px;"
        >

            <small>
                RONDE
            </small>

            <h2 id="roundDisplay">
                Ronde 1
            </h2>

        </div>


        <!-- QUESTION -->

        <div
            class="waiting"
            style="margin-top:20px;"
        >

            <small>
                ❓ PERTANYAAN
            </small>

            <h2 id="questionText">
                Menunggu pertanyaan...
            </h2>

        </div>


        <!-- BELL -->

        <div
            style="
                margin-top:30px;
                text-align:center;
            "
        >

            <p
                id="bellStatus"
                style="
                    margin-bottom:18px;
                    opacity:0.85;
                "
            >
                ⏳ Menunggu pertanyaan
            </p>


            <button
                id="bellButton"
                type="button"
                onclick="pressBell()"
                style="
                    width:190px;
                    height:190px;
                    border-radius:50%;
                    border:none;
                    font-size:65px;
                    cursor:pointer;
                    background:linear-gradient(
                        145deg,
                        #ffcc00,
                        #ff8c00
                    );
                    box-shadow:
                        0 10px 30px
                        rgba(255,140,0,0.4);
                    transition:
                        transform 0.1s,
                        opacity 0.2s;
                "
            >
                🔔
            </button>


            <h2
                id="winnerText"
                style="
                    margin-top:22px;
                "
            >
                Siapa paling cepat?
            </h2>

        </div>


        <!-- =================================
             AREA JAWABAN
        ================================== -->

        <div
            id="answerArea"
            class="waiting"
            style="
                margin-top:30px;
                display:none;
            "
        >

            <h2>
                ✍️ Jawaban Kamu
            </h2>

            <p
                id="answerInfo"
                style="
                    opacity:0.8;
                    margin-bottom:15px;
                "
            >
                Kamu memenangkan Bell!
            </p>


            <textarea
                id="answerInput"
                placeholder="Tulis jawaban kamu di sini..."
                rows="4"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:15px;
                    border-radius:12px;
                    border:1px solid rgba(255,255,255,0.2);
                    background:rgba(255,255,255,0.08);
                    color:inherit;
                    font-size:16px;
                    resize:vertical;
                    outline:none;
                "
            ></textarea>


            <button
                id="submitAnswerButton"
                type="button"
                onclick="submitAnswer()"
                style="
                    width:100%;
                    margin-top:15px;
                    padding:15px;
                    border:none;
                    border-radius:12px;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                📤 KIRIM JAWABAN
            </button>


            <p
                id="answerStatus"
                style="
                    margin-top:15px;
                    text-align:center;
                "
            ></p>

        </div>


        <!-- SCORE -->

        <div
            class="waiting"
            style="margin-top:30px;"
        >

            <h2>
                🏆 Skor
            </h2>

            <p>
                Sistem skor akan kita tambahkan
                setelah sistem jawaban stabil.
            </p>

        </div>


        <p class="version">
            GEN Z BATTLE • REALTIME
        </p>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        // =====================================================
        // DATA LOCAL STORAGE
        // =====================================================

        const playerName =
            localStorage.getItem(
                "genz_player_name"
            );

        const playerId =
            localStorage.getItem(
                "genz_player_id"
            );

        const roomCode =
            localStorage.getItem(
                "genz_room"
            );

        const roomId =
            localStorage.getItem(
                "genz_room_id"
            );


        // =====================================================
        // ELEMENT
        // =====================================================

        const playerNameElement =
            document.getElementById(
                "playerName"
            );

        const roomCodeElement =
            document.getElementById(
                "roomCode"
            );

        const roundDisplay =
            document.getElementById(
                "roundDisplay"
            );

        const questionText =
            document.getElementById(
                "questionText"
            );

        const bellButton =
            document.getElementById(
                "bellButton"
            );

        const bellStatus =
            document.getElementById(
                "bellStatus"
            );

        const winnerText =
            document.getElementById(
                "winnerText"
            );

        const answerArea =
            document.getElementById(
                "answerArea"
            );

        const answerInput =
            document.getElementById(
                "answerInput"
            );

        const submitAnswerButton =
            document.getElementById(
                "submitAnswerButton"
            );

        const answerStatus =
            document.getElementById(
                "answerStatus"
            );


        // =====================================================
        // TAMPILKAN DATA PLAYER
        // =====================================================

        playerNameElement.textContent =
            playerName || "Player";

        roomCodeElement.textContent =
            roomCode || "------";


        // =====================================================
        // STATE GAME
        // =====================================================

        let currentRound = 1;

        let currentQuestion = "";

        let bellLocked = true;

        let currentWinnerId = null;


        // =====================================================
        // KUNCI BELL
        // =====================================================

        function lockBell() {

            bellLocked = true;

            bellButton.disabled = true;

            bellButton.style.opacity =
                "0.35";

            bellButton.style.cursor =
                "not-allowed";

        }


        // =====================================================
        // BUKA BELL
        // =====================================================

        function unlockBell() {

            if (!playerId) {
                return;
            }

            bellLocked = false;

            bellButton.disabled = false;

            bellButton.style.opacity =
                "1";

            bellButton.style.cursor =
                "pointer";

        }


        // =====================================================
        // RESET JAWABAN
        // =====================================================

        function resetAnswerArea() {

            currentWinnerId = null;

            answerArea.style.display =
                "none";

            answerInput.value = "";

            answerInput.disabled = false;

            submitAnswerButton.disabled =
                false;

            submitAnswerButton.style.opacity =
                "1";

            answerStatus.textContent =
                "";

        }


        // =====================================================
        // TAMPILKAN AREA JAWABAN
        // =====================================================

        function showAnswerArea() {

            if (
                !playerId ||
                !currentWinnerId
            ) {
                return;
            }


            // Hanya pemenang Bell
            if (
                currentWinnerId !==
                playerId
            ) {

                answerArea.style.display =
                    "none";

                return;
            }


            answerArea.style.display =
                "block";

            answerInfo.textContent =
                "🏆 Kamu memenangkan Bell! Silakan jawab pertanyaan.";

            answerInput.focus();

        }


        // =====================================================
        // TAMPILKAN PERTANYAAN
        // =====================================================

        function renderQuestion() {

            roundDisplay.textContent =
                "Ronde " +
                currentRound;


            if (currentQuestion) {

                questionText.textContent =
                    currentQuestion;

                bellStatus.textContent =
                    "🔔 Bell siap!";

                winnerText.textContent =
                    "Siapa paling cepat?";

                resetAnswerArea();

                unlockBell();

            } else {

                questionText.textContent =
                    "Menunggu pertanyaan...";

                bellStatus.textContent =
                    "⏳ Menunggu pertanyaan";

                winnerText.textContent =
                    "Host sedang menyiapkan pertanyaan.";

                resetAnswerArea();

                lockBell();

            }

        }


        // =====================================================
        // LOAD ROOM
        // =====================================================

        async function loadRoomGame() {

            if (!roomId) {

                questionText.textContent =
                    "❌ Room tidak ditemukan.";

                bellStatus.textContent =
                    "Room ID tidak tersedia.";

                lockBell();

                return;
            }


            const {
                data: room,
                error
            } = await sb
                .from("rooms")
                .select(
                    "current_question, round_number, status"
                )
                .eq(
                    "id",
                    roomId
                )
                .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengambil room:",
                    error
                );

                questionText.textContent =
                    "❌ Gagal mengambil game.";

                lockBell();

                return;
            }


            if (!room) {

                questionText.textContent =
                    "❌ Room tidak ditemukan.";

                lockBell();

                return;
            }


            currentRound =
                Number(
                    room.round_number
                ) || 1;


            currentQuestion =
                room.current_question ||
                "";


            renderQuestion();


            await loadWinner();

        }


        // =====================================================
        // TEKAN BELL
        // =====================================================

        async function pressBell() {

            if (bellLocked) {
                return;
            }


            if (!playerId) {

                bellStatus.textContent =
                    "👑 Host mengatur permainan.";

                return;
            }


            if (!roomId) {

                bellStatus.textContent =
                    "❌ Room tidak ditemukan.";

                return;
            }


            lockBell();

            bellStatus.textContent =
                "⏳ Memproses bell...";

            winnerText.textContent =
                "Menentukan siapa yang paling cepat...";


            try {

                const {
                    data,
                    error
                } = await sb
                    .from("bell_battles")
                    .insert({
                        room_id:
                            roomId,

                        round_number:
                            currentRound,

                        player_id:
                            playerId
                    })
                    .select()
                    .single();


                if (error) {

                    console.error(
                        "❌ Bell error:",
                        error
                    );


                    if (
                        error.code ===
                        "23505"
                    ) {

                        bellStatus.textContent =
                            "🔒 Bell sudah dimenangkan!";

                        await loadWinner();

                        return;
                    }


                    bellStatus.textContent =
                        "❌ Gagal menekan bell.";

                    winnerText.textContent =
                        error.message ||
                        "Terjadi kesalahan.";

                    return;
                }


                console.log(
                    "🏆 Bell berhasil:",
                    data
                );


                currentWinnerId =
                    playerId;


                showWinner(
                    playerName ||
                    "Player"
                );


                showAnswerArea();


            } catch (error) {

                console.error(
                    "❌ Error:",
                    error
                );


                bellStatus.textContent =
                    "❌ Terjadi kesalahan.";

                winnerText.textContent =
                    error.message ||
                    "Silakan coba lagi.";

            }

        }


        // =====================================================
        // LOAD PEMENANG
        // =====================================================

        async function loadWinner() {

            if (!roomId) {
                return;
            }


            const {
                data,
                error
            } = await sb
                .from("bell_battles")
                .select(
                    "id, player_id, round_number, pressed_at"
                )
                .eq(
                    "room_id",
                    roomId
                )
                .eq(
                    "round_number",
                    currentRound
                )
                .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengambil pemenang:",
                    error
                );

                return;
            }


            if (!data) {

                currentWinnerId = null;

                winnerText.textContent =
                    "Siapa paling cepat?";

                bellStatus.textContent =
                    "🔔 Bell siap!";

                answerArea.style.display =
                    "none";

                unlockBell();

                return;
            }


            currentWinnerId =
                data.player_id;


            await showWinnerById(
                data.player_id
            );


            showAnswerArea();

        }


        // =====================================================
        // AMBIL NAMA PEMENANG
        // =====================================================

        async function showWinnerById(
            winnerPlayerId
        ) {

            const {
                data,
                error
            } = await sb
                .from("players")
                .select("name")
                .eq(
                    "id",
                    winnerPlayerId
                )
                .maybeSingle();


            if (error) {

                console.error(
                    "❌ Gagal mengambil nama:",
                    error
                );

                showWinner(
                    "Player"
                );

                return;
            }


            showWinner(
                data?.name ||
                "Player"
            );

        }


        // =====================================================
        // TAMPILKAN PEMENANG
        // =====================================================

        function showWinner(
            winnerName
        ) {

            lockBell();


            bellStatus.textContent =
                "🔒 BELL TERKUNCI";


            if (
                winnerName ===
                (playerName || "")
            ) {

                winnerText.textContent =
                    "🏆 KAMU MENANG BELL!";

            } else {

                winnerText.textContent =
                    "🏆 " +
                    winnerName +
                    " MENANG BELL!";

            }

        }


        // =====================================================
        // KIRIM JAWABAN
        // =====================================================

        async function submitAnswer() {

            if (!playerId) {
                return;
            }


            const answer =
                answerInput.value.trim();


            if (!answer) {

                answerStatus.textContent =
                    "⚠️ Jawaban belum diisi.";

                answerInput.focus();

                return;
            }


            submitAnswerButton.disabled =
                true;

            answerInput.disabled =
                true;

            answerStatus.textContent =
                "⏳ Mengirim jawaban...";


            // Untuk tahap pertama,
            // jawaban disimpan sementara
            // di localStorage.

            const answerData = {

                room_id:
                    roomId,

                round_number:
                    currentRound,

                player_id:
                    playerId,

                answer:
                    answer,

                submitted_at:
                    new Date().toISOString()

            };


            localStorage.setItem(
                "genz_current_answer",
                JSON.stringify(
                    answerData
                )
            );


            answerStatus.textContent =
                "✅ Jawaban berhasil dikirim!";

        }


        // =====================================================
        // REALTIME ROOM
        // =====================================================

        function listenForRoomChanges() {

            if (!roomId) {
                return;
            }


            sb
                .channel(
                    "game-room-" +
                    roomId
                )
                .on(
                    "postgres_changes",
                    {
                        event: "UPDATE",
                        schema: "public",
                        table: "rooms",
                        filter:
                            "id=eq." +
                            roomId
                    },
                    async function(payload) {

                        console.log(
                            "⚡ Room berubah:",
                            payload.new
                        );


                        currentRound =
                            Number(
                                payload.new
                                    .round_number
                            ) || 1;


                        currentQuestion =
                            payload.new
                                .current_question ||
                            "";


                        renderQuestion();


                        await loadWinner();

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime Room:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // REALTIME BELL
        // =====================================================

        function listenForBell() {

            if (!roomId) {
                return;
            }


            sb
                .channel(
                    "bell-game-" +
                    roomId
                )
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "bell_battles",
                        filter:
                            "room_id=eq." +
                            roomId
                    },
                    async function(payload) {

                        console.log(
                            "🔔 Bell realtime:",
                            payload
                        );


                        if (
                            Number(
                                payload.new
                                    .round_number
                            ) !==
                            currentRound
                        ) {

                            return;
                        }


                        currentWinnerId =
                            payload.new
                                .player_id;


                        await showWinnerById(
                            payload.new
                                .player_id
                        );


                        showAnswerArea();

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime Bell:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // MULAI GAME
        // =====================================================

        async function initializeGame() {

            lockBell();

            resetAnswerArea();

            await loadRoomGame();

            listenForRoomChanges();

            listenForBell();

        }


        initializeGame();

    </script>

</body>

</html>
