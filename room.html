<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Room - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->

        <div class="badge">
            🔥 ROOM READY
        </div>

        <p class="subtitle">
            Bagikan kode ini kepada peserta
        </p>


        <!-- ROOM CODE -->

        <div class="room-code-box">

            <small>
                KODE ROOM
            </small>

            <strong id="roomCode">
                ------
            </strong>

        </div>


        <!-- ROOM INFO -->

        <div class="room-info">

            <div>
                <span>👑 Host</span>
                <strong id="hostDisplay">
                    -
                </strong>
            </div>

            <div>
                <span>👥 Kapasitas</span>

                <strong>

                    <span id="maxPlayers">
                        6
                    </span>

                    Pemain

                </strong>

            </div>

            <div>
                <span>🎯 Kategori</span>

                <strong id="categoryDisplay">
                    Random
                </strong>
            </div>

        </div>


        <!-- PLAYER LIST -->

        <div
            class="waiting"
            style="margin-top:20px;"
        >

            <h2>

                👥 Pemain

                <span id="playerCountDisplay">
                    (0/6)
                </span>

            </h2>


            <div
                id="playersList"
                style="
                    margin-top:15px;
                    text-align:left;
                "
            >

                <p
                    id="noPlayers"
                    style="
                        text-align:center;
                        opacity:0.7;
                    "
                >
                    ⏳ Menunggu pemain...
                </p>

            </div>

        </div>


        <!-- WAITING -->

        <div class="waiting">

            <div class="loading-dot">
                ●
            </div>

            <h2>
                Menunggu pemain...
            </h2>

            <p>
                Peserta dapat bergabung menggunakan
                kode room di atas.
            </p>

        </div>


        <!-- START GAME -->

        <button
            class="create-button"
            id="startGameButton"
            onclick="startGame()"
        >
            🚀 MULAI GAME
        </button>


        <p class="version">
            GEN Z BATTLE • V0.4
        </p>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="script.js"></script>


    <script>

        // =====================================================
        // ROOM DATA
        // =====================================================

        let roomId = null;

        let roomMaxPlayers = 6;


        // =====================================================
        // SETUP ROOM
        // =====================================================

        async function setupRoom() {

            const roomCode =
                localStorage.getItem(
                    "genz_room"
                );

            const hostName =
                localStorage.getItem(
                    "genz_host"
                );

            roomId =
                localStorage.getItem(
                    "genz_room_id"
                );

            const maxPlayers =
                localStorage.getItem(
                    "genz_players"
                );

            const category =
                localStorage.getItem(
                    "genz_category"
                );


            // -------------------------------------------------
            // ROOM CODE
            // -------------------------------------------------

            const roomCodeElement =
                document.getElementById(
                    "roomCode"
                );

            if (roomCodeElement) {

                roomCodeElement.textContent =
                    roomCode ||
                    "------";

            }


            // -------------------------------------------------
            // HOST
            // -------------------------------------------------

            const hostElement =
                document.getElementById(
                    "hostDisplay"
                );

            if (hostElement) {

                hostElement.textContent =
                    hostName ||
                    "-";

            }


            // -------------------------------------------------
            // MAX PLAYERS
            // -------------------------------------------------

            roomMaxPlayers =
                Number(
                    maxPlayers
                ) || 6;


            const maxPlayersElement =
                document.getElementById(
                    "maxPlayers"
                );

            if (maxPlayersElement) {

                maxPlayersElement.textContent =
                    roomMaxPlayers;

            }


            // -------------------------------------------------
            // CATEGORY
            // -------------------------------------------------

            const categoryNames = {

                "random":
                    "🎲 Random",

                "general":
                    "📚 Pengetahuan Umum",

                "genz":
                    "🔥 Gen Z",

                "random-question":
                    "🤪 Pertanyaan Random"

            };


            const categoryElement =
                document.getElementById(
                    "categoryDisplay"
                );


            if (categoryElement) {

                categoryElement.textContent =
                    categoryNames[category] ||
                    "🎲 Random";

            }


            // -------------------------------------------------
            // ROOM ID
            // -------------------------------------------------

            if (!roomId) {

                console.error(
                    "❌ Room ID tidak ditemukan."
                );

                return;
            }


            // -------------------------------------------------
            // LOAD PLAYERS
            // -------------------------------------------------

            await loadPlayers();


            // -------------------------------------------------
            // REALTIME PLAYERS
            // -------------------------------------------------

            listenForPlayers();


            // -------------------------------------------------
            // REALTIME ROOM STATUS
            // -------------------------------------------------

            listenForRoomStatus();

        }


        // =====================================================
        // LOAD PLAYERS
        // =====================================================

        async function loadPlayers() {

            if (!roomId) {
                return;
            }


            const {
                data: players,
                error
            } = await sb
                .from("players")
                .select("*")
                .eq(
                    "room_id",
                    roomId
                )
                .order(
                    "joined_at",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(
                    "❌ Gagal mengambil player:",
                    error
                );

                return;
            }


            renderPlayers(
                players || []
            );

        }


        // =====================================================
        // RENDER PLAYER
        // =====================================================

        function renderPlayers(
            players
        ) {

            const list =
                document.getElementById(
                    "playersList"
                );

            const countDisplay =
                document.getElementById(
                    "playerCountDisplay"
                );


            if (
                !list ||
                !countDisplay
            ) {

                return;

            }


            countDisplay.textContent =
                "(" +
                players.length +
                "/" +
                roomMaxPlayers +
                ")";


            // -------------------------------------------------
            // BELUM ADA PLAYER
            // -------------------------------------------------

            if (
                players.length === 0
            ) {

                list.innerHTML = `

                    <p
                        style="
                            text-align:center;
                            opacity:0.7;
                        "
                    >
                        ⏳ Menunggu pemain...
                    </p>

                `;

                return;
            }


            // -------------------------------------------------
            // RENDER
            // -------------------------------------------------

            list.innerHTML = "";


            players.forEach(
                function(
                    player,
                    index
                ) {

                    const playerItem =
                        document.createElement(
                            "div"
                        );


                    playerItem.style.cssText = `

                        display:flex;

                        align-items:center;

                        gap:12px;

                        padding:12px;

                        margin-bottom:8px;

                        border-radius:12px;

                        background:
                            rgba(
                                255,
                                255,
                                255,
                                0.06
                            );

                        border:
                            1px solid
                            rgba(
                                255,
                                255,
                                255,
                                0.08
                            );

                    `;


                    playerItem.innerHTML = `

                        <span
                            style="
                                font-size:22px;
                            "
                        >
                            🟢
                        </span>

                        <div>

                            <strong>
                                ${escapeHTML(
                                    player.name
                                )}
                            </strong>

                            <small
                                style="
                                    display:block;
                                    opacity:0.6;
                                "
                            >
                                Player
                                ${index + 1}
                            </small>

                        </div>

                    `;


                    list.appendChild(
                        playerItem
                    );

                }
            );

        }


        // =====================================================
        // REALTIME PLAYERS
        // =====================================================

        function listenForPlayers() {

            if (!roomId) {
                return;
            }


            sb
                .channel(
                    "room-players-" +
                    roomId
                )
                .on(
                    "postgres_changes",
                    {
                        event: "*",
                        schema: "public",
                        table: "players",
                        filter:
                            "room_id=eq." +
                            roomId
                    },
                    function(payload) {

                        console.log(
                            "👤 Player berubah:",
                            payload
                        );


                        loadPlayers();

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime player:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // REALTIME ROOM STATUS
        // =====================================================

        function listenForRoomStatus() {

            if (!roomId) {

                console.error(
                    "❌ Room ID tidak ditemukan."
                );

                return;
            }


            sb
                .channel(
                    "room-status-" +
                    roomId
                )
                .on(
                    "postgres_changes",
                    {
                        event: "UPDATE",
                        schema: "public",
                        table: "rooms",
                        filter:
                            "id=eq." +
                            roomId
                    },
                    function(payload) {

                        console.log(
                            "🔥 Status room berubah:",
                            payload.new.status
                        );


                        if (
                            payload.new.status ===
                            "playing"
                        ) {

                            /*
                             * HOST
                             * → host-game.html
                             *
                             * PLAYER
                             * → game.html
                             */

                            const isHost =
                                localStorage.getItem(
                                    "genz_host"
                                ) &&
                                !localStorage.getItem(
                                    "genz_player_id"
                                );


                            if (isHost) {

                                window.location.href =
                                    "host-game.html";

                            } else {

                                window.location.href =
                                    "game.html";

                            }

                        }

                    }
                )
                .subscribe(
                    function(status) {

                        console.log(
                            "⚡ Realtime room:",
                            status
                        );

                    }
                );

        }


        // =====================================================
        // START GAME
        // =====================================================

        async function startGame() {

            if (!roomId) {

                alert(
                    "❌ Room ID tidak ditemukan."
                );

                return;
            }


            try {

                const {
                    error
                } = await sb
                    .from("rooms")
                    .update({
                        status:
                            "playing"
                    })
                    .eq(
                        "id",
                        roomId
                    );


                if (error) {

                    console.error(
                        "❌ Gagal memulai game:",
                        error
                    );

                    alert(
                        "❌ Gagal memulai game.\n\n" +
                        error.message
                    );

                    return;
                }


                /*
                 * Redirect Host sendiri.
                 */

                window.location.href =
                    "host-game.html";


            } catch (error) {

                console.error(
                    "❌ Error:",
                    error
                );

                alert(
                    "❌ Terjadi kesalahan.\n\n" +
                    error.message
                );

            }

        }


        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHTML(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text || "";

            return div.innerHTML;

        }


        // =====================================================
        // MULAI
        // =====================================================

        setupRoom();

    </script>

</body>

</html>
