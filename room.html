<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Room - GEN Z BATTLE</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <div class="badge">
            🔥 ROOM READY
        </div>


        <p class="subtitle">
            Bagikan kode ini kepada peserta
        </p>


        <div class="room-code-box">

            <small>
                KODE ROOM
            </small>

            <strong id="roomCode">
                ------
            </strong>

        </div>


        <div class="room-info">

            <div>
                <span>👑 Host</span>

                <strong id="hostDisplay">
                    -
                </strong>
            </div>


            <div>
                <span>👥 Kapasitas</span>

                <strong>
                    <span id="maxPlayers">
                        6
                    </span>
                    Pemain
                </strong>
            </div>


            <div>
                <span>🎯 Kategori</span>

                <strong id="categoryDisplay">
                    Random
                </strong>
            </div>

        </div>


        <div class="waiting">

            <div class="loading-dot">
                ●
            </div>

            <h2>
                Menunggu pemain...
            </h2>

            <p>
                Peserta dapat bergabung menggunakan
                kode room di atas.
            </p>

        </div>


        <button
            class="create-button"
            onclick="startGame()"
        >
            🚀 MULAI GAME
        </button>


        <p class="version">
            GEN Z BATTLE • V0.1
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
